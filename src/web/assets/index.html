<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="osu-collect-token" content="__SESSION_TOKEN__">
  <title>osu!collect</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      const p = JSON.parse(localStorage.getItem('oc.prefs') || '{}');
      const mode = p.theme || 'dark';
      const dark = mode === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : mode !== 'light';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      if (mode === 'lazer') document.documentElement.dataset.skin = 'lazer';
      if (p.accent) document.documentElement.dataset.accent = p.accent;
      if (p.density) document.documentElement.dataset.density = p.density;
    } catch (_) {}
  </script>
</head>
<body>
  <canvas id="triangles" aria-hidden="true"></canvas>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/download">
        <svg class="logo" viewBox="0 0 64 64" width="32" height="32" aria-hidden="true">
          <defs><linearGradient id="lg-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff7ab6"/><stop offset=".55" stop-color="#ff4f9a"/><stop offset="1" stop-color="#9d5cff"/></linearGradient></defs>
          <rect width="64" height="64" rx="18" fill="url(#lg-bg)"/>
          <circle class="l-back" cx="18" cy="18" r="9" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="4"/>
          <circle class="l-mid" cx="26" cy="26" r="9.5" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="4"/>
          <circle class="l-approach" cx="35" cy="35" r="15" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
          <circle cx="35" cy="35" r="10" fill="#fff"/>
          <circle class="l-core" cx="35" cy="35" r="4" fill="#ff4f9a"/>
        </svg>
        <span>osu!<b>collect</b></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="conn" id="conn"><span class="dot"></span><span id="conn-label"></span></div>
        <div class="version" id="version"></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title"></h1>
          <p id="page-sub" class="muted"></p>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/icons.js"></script>
  <script src="/app.js"></script>
</body>
</html>
